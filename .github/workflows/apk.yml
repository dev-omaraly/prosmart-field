name: Build Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run build
      - name: Add Android platform if missing
        run: '[ -d android ] || npx cap add android'
      - name: Add camera and location permissions
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q 'permission.CAMERA' $f || sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <application#' $f
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: prosmart-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
